<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>Visual File Receiver · Robust</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#f5f5f7}
main{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:#17171a;border:1px solid #2a2a2e;border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{border:0;border-radius:10px;padding:10px 14px;font-size:16px}
button{background:#2f6fed;color:#fff}.secondary{background:#343438}.danger{background:#7a2e2e}
select{background:#2a2a2d;color:#fff}label{font-size:14px;color:#c6c6c9}
#stage{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#000;aspect-ratio:3/4}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#overlay{pointer-events:none}
progress{width:100%;height:18px}#status{margin:8px 0;line-height:1.45}
.small{color:#a7a7ad;font-size:13px;line-height:1.45}.good{color:#6ed47d}.bad{color:#ff7373}.warn{color:#ffd166}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#2a2a2d;font-size:12px;margin-left:6px}
</style>
</head>
<body>
<main>
<h1>Visual File Receiver <span class="badge">Robust v2</span></h1>
<section class="card">
  <div class="row">
    <label>Grid <select id="grid"><option value="64" selected>64 × 64</option><option value="80">80 × 80</option><option value="96">96 × 96</option></select></label>
    <label>定位 <select id="mode"><option value="auto" selected>自动四角</option><option value="fallback">中心框兼容</option></select></label>
    <button id="startBtn">开始扫描</button><button id="stopBtn" class="secondary">停止</button><button id="resetBtn" class="danger">重置</button>
  </div>
  <div id="status">尚未启动摄像头。</div>
  <progress id="progress" max="1" value="0"></progress>
  <div id="info" class="small mono"></div>
  <div id="diag" class="small mono"></div>
</section>
<section class="card">
  <div id="stage"><video id="video" playsinline muted autoplay></video><canvas id="overlay"></canvas></div>
  <div class="small" style="margin-top:10px">自动模式会检测四个 7×7 定位标记并做透视矫正。绿色四边形表示已锁定；未锁定时可将视觉码大致置于黄色框内。</div>
</section>
<section class="card"><div class="small">纯 HTML + 内嵌 JavaScript，无 CDN、无 OpenCV.js、无上传逻辑。文件数据只在本机浏览器内重组，并使用 SHA-256 校验。</div></section>
</main>

function drawOverlay(now){const w=overlay.width,h=overlay.height;ctx.clearRect(0,0,w,h);const auto=modeSelect.value==='auto';if(auto&&lock&&now-lock.time<=LOCK_TTL){const sx=w/work.width,sy=h/work.height;ctx.lineWidth=Math.max(4,w/420);ctx.strokeStyle='rgba(50,255,100,.95)';ctx.beginPath();lock.points.forEach((p,i)=>{const x=p.x*sx,y=p.y*sy;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.stroke();for(const p of lock.points){ctx.beginPath();ctx.arc(p.x*sx,p.y*sy,Math.max(7,w/120),0,Math.PI*2);ctx.stroke()}}else{const side=Math.min(w,h)*.82,x=(w-side)/2,y=(h-side)/2;ctx.lineWidth=Math.max(3,w/450);ctx.strokeStyle='rgba(255,205,80,.85)';ctx.strokeRect(x,y,side,side)}}
function renderLoop(now=performance.now()){if(!running)return;if(video.readyState>=2&&video.videoWidth>0){if(overlay.width!==video.videoWidth||overlay.height!==video.videoHeight){overlay.width=video.videoWidth;overlay.height=video.videoHeight}if(now-lastDecodeAt>=DECODE_MS){lastDecodeAt=now;try{processFrame(now)}catch(e){badFrames++}}drawOverlay(now);diagEl.textContent=`decoder=${modeSelect.value} | lock=${lock&&now-lock.time<=LOCK_TTL?'YES':'NO'} | good=${goodFrames} | misses=${badFrames} | detect=${detectAttempts}`}rafId=requestAnimationFrame(renderLoop)}
startBtn.addEventListener('click',startCamera);stopBtn.addEventListener('click',stopCamera);resetBtn.addEventListener('click',()=>{resetTransfer();lock=null});gridSelect.addEventListener('change',()=>lock=null);modeSelect.addEventListener('change',()=>lock=null);window.addEventListener('beforeunload',stopCamera);resetTransfer();
})();
